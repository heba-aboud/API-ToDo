<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="header">
            <h1> To-Do List App</h1>
        </div>
    </header>
    <main>
        <div class="main-content">
            <div class="todo-app">
                <div class="app-title">
                    <h2>My To-Do List</h2>
                    <p>Stay organized and productive</p>
                </div>

                <div class="input-area">
                    <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
                    <button class="add-btn" id="addBtn">Add</button>
                </div>

                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="clear-completed-btn" id="clearCompletedBtn">Clear Completed</button>
                </div>

                <ul class="task-list" id="taskList">

                </ul>

                <div class="empty-state" id="emptyState" style="display: block;">
                    <div class="icon">☑</div>
                    <p>No tasks yet. Add one above!</p>
                </div>

                <div class="task-counter" id="taskCounter">
                    <span id="activeCount">0</span> tasks remaining
                </div>
            </div>
        </div>
    </main>
    <script src="js/list.js"></script>
</body>

</html>
